name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Make the wrapper executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :app:testFastDebugUnitTest :app:testYtdlpDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew :app:lintFastDebug --stacktrace

      - name: Assemble debug APKs
        run: ./gradlew :app:assembleFastDebug :app:assembleYtdlpDebug --stacktrace

      - name: Upload debug APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: debug-apks
          path: |
            app/build/outputs/apk/fast/debug/*.apk
            app/build/outputs/apk/ytdlp/debug/*.apk
          if-no-files-found: error
