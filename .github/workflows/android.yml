name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make the wrapper executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :app:testFastDebugUnitTest :app:testYtdlpDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew :app:lintFastDebug --stacktrace

      - name: Assemble debug APKs
        run: ./gradlew :app:assembleFastDebug :app:assembleYtdlpDebug --stacktrace

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: debug-apks
          path: |
            app/build/outputs/apk/fast/debug/*.apk
            app/build/outputs/apk/ytdlp/debug/*.apk
          if-no-files-found: error
